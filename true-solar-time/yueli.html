<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>农历月历 · 干支宜忌 | 真太阳时 · 子午流注</title>
<meta name="description" content="农历月历:每天格子显示农历、干支与宜忌,点击进当日时辰。真太阳时定时辰,传统民俗参考。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#070b16"><link rel="stylesheet" href="styles.css"><script src="theme.js"></script><script src="a11y.js"></script>
<style>
.calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.calhead .t{font-size:18px;font-weight:800;font-family:var(--serif)}
.calhead .t small{color:var(--mut);font-size:12.5px;font-weight:400;font-family:var(--sans)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .w{font-size:11.5px;color:var(--mut);text-align:center;padding:4px 0;letter-spacing:.2em}
.cell{border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;background:var(--shade);cursor:pointer;min-height:74px;transition:.15s}
.cell:hover{border-color:var(--gold)}
.cell.today{border-color:var(--gold);background:rgba(var(--gold-rgb),.12)}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.cell .d{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.cell .l{font-size:11px;color:var(--mut);margin-top:2px}
.cell .g{font-size:11px;color:var(--gold2);margin-top:2px}
.cell .y{font-size:10.5px;margin-top:3px;line-height:1.5}
.cell .y i{font-style:normal;color:var(--green)}
.cell .y e{font-style:normal;color:var(--red)}
.cell.blank{background:transparent;border-color:transparent;cursor:default;min-height:0}
@media(max-width:640px){.cell{min-height:66px}.cell .d{font-size:14px}}
.dayinfo{margin-top:14px;border:1px solid rgba(var(--gold-rgb),.35);border-radius:14px;padding:14px 16px;background:rgba(var(--gold-rgb),.05);font-size:13.5px;line-height:1.9}
.dayinfo b{color:var(--gold2)}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
<div class="logo">☉ 真太阳时 <b>· 子午流注</b></div>
<nav class="tabs"><a href="index.html">今日行动</a><a href="cities.html">全国总表</a><a href="jieqi.html">节气养生</a><a href="liuzhu.html">时辰流注</a><a href="tools.html">实用工具</a><a href="zeri.html">择时</a><a href="yueli.html">月历</a><a href="science.html">天文原理</a><a href="vip.html">会员</a></nav>
<div class="top-right"><span class="pill" id="vipPill">—</span></div>
</div></div>
<div class="wrap">
<header class="hero"><h1>农历月历 <span class="g">· 干支宜忌</span></h1>
<div class="sub">每月格子显示<b>农历 + 干支日 + 宜忌首字</b>,点击任意一天看当日时辰与黄历。干支与首页黄历同源,传统民俗参考。</div></header>
<section class="card">
<div class="calhead">
<button class="btn" id="prevM" type="button">‹ 上月</button>
<div class="t" id="calTitle">—</div>
<button class="btn" id="nextM" type="button">下月 ›</button>
<button class="btn" id="backToday" type="button">回今日</button>
<span class="pill" id="lunarNow">—</span>
</div>
<div class="cal" id="cal"></div>
<div class="dayinfo" id="dayInfo">点击某天查看详情。</div>
</section>
<footer class="site">干支纪日 JDN+49 · 建除十二神程序化推算 · 传统文化参考,不作决策依据 · <a href="privacy.html">隐私政策</a> · <a href="terms.html">用户协议</a></footer>
</div>
<script src="cities.js"></script><script src="astro.js"></script><script src="app.js"></script><script src="huangli.js"></script><script src="lunar.js"></script>
<script>
(function(){
const {$,VIP,termOf}=window.TST;
TST.setNav();
const p=$("vipPill"),on=VIP.isActive();
if(on)p.innerHTML='<span class="badge-vip">✦ 会员</span>';else p.textContent="未开通会员";
const now=new Date(),bj=ASTRO.bjtParts(now);
let vy=bj.y,vm=bj.m;
const WE=["一","二","三","四","五","六","日"];
function render(){
  const box=$("cal");box.innerHTML="";
  WE.forEach(w=>{const d=document.createElement("div");d.className="w";d.textContent=w;box.appendChild(d);});
  const first=new Date(Date.UTC(vy,vm-1,1)).getUTCDay();
  const blanks=(first+6)%7;
  for(let i=0;i<blanks;i++){const d=document.createElement("div");d.className="cell blank";box.appendChild(d);}
  const days=new Date(Date.UTC(vy,vm,0)).getUTCDate();
  $("calTitle").innerHTML=vy+"年"+vm+"月 <small>"+termOf(ASTRO.sunApparent(new Date(Date.UTC(vy,vm-1,15))).lambda)+"前后</small>";
  for(let d=1;d<=days;d++){
    const l=TSTLunar.solar2lunar(vy,vm,d),g=TSTLunar.dayGZ(vy,vm,d);
    const mzhi=TST.jieZhi?TST.jieZhi(ASTRO.sunApparent(new Date(Date.UTC(vy,vm-1,Math.min(d,28)))).lambda):"寅";
    let hl=null;try{hl=TSTHuangli.huangli(g,mzhi);}catch(e){}
    const c=document.createElement("div");
    const isToday=(vy===bj.y&&vm===bj.m&&d===bj.d);
    c.className="cell"+(isToday?" today":"");
    c.innerHTML='<div class="d">'+d+'</div><div class="l">'+TSTLunar.fmtLunar(l)+'</div><div class="g">'+g.g+g.z+'</div>'+
      (hl?'<div class="y"><i>宜'+hl.yi[0]+'</i> <e>忌'+hl.ji[0]+'</e></div>':"");
    c.onclick=()=>{document.querySelectorAll(".cell").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");showDay(d,l,g,hl);};
    box.appendChild(c);
    if(isToday)showDay(d,l,g,hl);
  }
}
function showDay(d,l,g,hl){
  $("dayInfo").innerHTML='<b>'+vy+'年'+vm+'月'+d+'日</b> · 农历'+TSTLunar.fmtLunar(l)+' · 干支日 <b>'+g.g+g.z+'</b>'+
    (hl?'<br>建除 <b>'+hl.jianchu+'</b>日 · 宜 <b style="color:var(--green)">'+hl.yi.join(" ")+'</b> · 忌 <b style="color:var(--red)">'+hl.ji.join(" ")+'</b><br>'+hl.chong+' · '+hl.sha+' · 胎神'+hl.taishen+' · 彭祖:'+hl.pengzu:"")+
    '<br><a class="btn gold" style="text-decoration:none;margin-top:8px;display:inline-block" href="liuzhu.html">看当日十二时辰 →</a>';
}
$("prevM").onclick=()=>{vm--;if(vm<1){vm=12;vy--;}render();};
$("nextM").onclick=()=>{vm++;if(vm>12){vm=1;vy++;}render();};
$("backToday").onclick=()=>{vy=bj.y;vm=bj.m;render();};
$("lunarNow").textContent="今农历 "+TSTLunar.fmtLunar(TSTLunar.solar2lunar(bj.y,bj.m,bj.d));
render();
})();
</script>
</body>
</html>
